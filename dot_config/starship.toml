"$schema" = "https://starship.rs/config-schema.json"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

add_newline = false

[username]
format = "[$user]($style)@"
style_user = "bright-black"
style_root = "bold red"

[hostname]
format = "[$hostname]($style) "
ssh_only = true
style = "bright-black"

[directory]
format = "[$path]($style) "
style = "blue"
truncation_length = 0
fish_style_pwd_dir_length = 1

[character]
success_symbol = "[>](purple)"
error_symbol = "[>](red)"

[git_branch]
format = "[$branch]($style) "
style = "bright-black"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "cyan"
conflicted = "="
ahead = ">${count}"
behind = "<${count}"
diverged = "<${behind_count}>${ahead_count}"
up_to_date = ""
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "r"
deleted = "x"
typechanged = "t"

[git_state]
format = "[($state( $progress_current/$progress_total))]($style) "
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
min_time = 2000
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []
detect_folders = []
